<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Verification</title>
  <link rel="stylesheet" href="/captcha.css">
</head>
<body>

  <main class="guard-container">
    <header class="guard-header">
      <h1 class="guard-title" data-i18n="title">Human Verification</h1>
      <p class="guard-subtitle" data-i18n="subtitle">Slide the puzzle piece into place to confirm you're a real person. This quick check helps protect this site from automated bots.</p>
    </header>

    <!-- Interactive CAPTCHA Mount Point -->
    <section id="captcha-container" aria-label="Slider Puzzle Challenge"></section>

    <!-- Protected Content Section (Revealed upon pass) -->
    <section id="protected-content" class="protected-content-box" aria-live="polite">
      <div class="protected-badge">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
        </svg>
        <span data-i18n="okBadge">Verification complete</span>
      </div>
      <p class="protected-info" id="protected-msg" data-i18n="okMsg">Thank you. You have been verified as a human visitor.</p>
      <button type="button" class="reset-btn" id="retest-btn" data-i18n="retest">Verify again</button>
    </section>
  </main>

  <script src="/i18n.js"></script>
  <script src="/captcha.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const protectedBox = document.getElementById('protected-content');
      const retestBtn = document.getElementById('retest-btn');
      const captchaContainer = document.getElementById('captcha-container');

      let captcha = new SliderCaptcha({
        containerId: 'captcha-container',
        apiBase: '/api/captcha',
        onSuccess: async (data) => {
          // 1. If the server has a redirect configured (redirectUrl in config.json), it tells us
          //    to follow its redirect endpoint. The destination itself never reaches the client.
          if (data.redirect) {
            window.location.href = data.redirect;
            return;
          }

          // 2. No redirect configured: confirm access with the protected endpoint, then show the success card
          try {
            const res = await fetch('/api/protected/content', {
              headers: { 'x-captcha-token': data.passToken }
            });
            if (res.ok) {
              captchaContainer.style.display = 'none';
              protectedBox.style.display = 'block';
            } else {
              captcha.showError(GuardI18n.t('errProtected'));
            }
          } catch (err) {
            captcha.showError(GuardI18n.t('errNetwork'));
          }
        },
        onError: (err) => {
          console.warn('Captcha failed or rejected:', err);
        }
      });

      retestBtn.addEventListener('click', () => {
        protectedBox.style.display = 'none';
        captchaContainer.style.display = 'block';
        captcha.loadChallenge();
      });
    });
  </script>
</body>
</html>
